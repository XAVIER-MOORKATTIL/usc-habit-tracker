<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero-Excuse Champion Tracker • v1.3</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1, h2 { margin-top: 0; color: #38bdf8; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 10px; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0284c7; color: white; }
    .habit-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 14px; border-radius: 8px; margin-top: 8px; }
    .done { text-decoration: line-through; color: #94a3b8; }
    .badge { background: #f59e0b; color: #0f172a; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-left: 8px; }
    .belief-box { background: #0f172a; border-left: 4px solid #10b981; padding: 12px; border-radius: 6px; margin-top: 10px; }
    .analytics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .stat-tile { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: #38bdf8; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
    .rank-pill { display: inline-block; background: linear-gradient(90deg, #10b981, #0ea5e9); color: #0f172a; font-weight: 800; font-size: 0.8rem; padding: 4px 12px; border-radius: 999px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 Zero-Excuse Champion Tracker</h1>

    <!-- Micro-Evolution v1.3: Witness Focus & Cloud-Synced Distraction Counter -->
    <div id="witness-bar" style="background: #162238; border: 1px solid #2b4166; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; color: #f8fafc;">
      <div>
        <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: #38bdf8; font-weight: 700;">Witness Focus Engine • v1.3</div>
        <div id="focus-timer-display" style="font-size: 1.75rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px;">25:00</div>
      </div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button type="button" onclick="toggleFocusTimer()" id="focus-toggle-btn" style="background: #0ea5e9; color: #0f172a; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer;">Start Sprint</button>
        <button type="button" onclick="resetFocusTimer()" style="background: #334155; color: #f8fafc; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer;">Reset</button>
        <button type="button" onclick="logWitnessRep()" style="background: #10b981; color: #0f172a; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer;">
          Witness Rep: <span id="witness-rep-count">0</span>
        </button>
      </div>
    </div>

    <!-- Login Section -->
    <div id="loginCard" class="card">
      <h2>Enter Your Champion ID</h2>
      <input type="text" id="usernameInput" placeholder="Enter your username (e.g. champion1)" />
      <button onclick="login()">Enter Dashboard</button>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard" class="hidden">
      <!-- Micro-Evolution v1.3: Creator Mode Analytics Summary -->
      <div class="card" style="border: 1px solid #38bdf8;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
          <h2 style="margin: 0;">📊 Creator Mode Analytics</h2>
          <span id="evolutionRank" class="rank-pill">Micro-Evolution Active</span>
        </div>
        <div class="analytics-grid">
          <div class="stat-tile">
            <div class="stat-value" id="statStreak">0</div>
            <div class="stat-label">Streak Power</div>
          </div>
          <div class="stat-tile">
            <div class="stat-value" id="statBeliefs" style="color: #10b981;">0</div>
            <div class="stat-label">Beliefs Rewired</div>
          </div>
          <div class="stat-tile">
            <div class="stat-value" id="statWitness" style="color: #f59e0b;">0</div>
            <div class="stat-label">Cloud Witness Reps</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>🎯 My 1 Big Goal</h2>
        <input type="text" id="goalInput" placeholder="What is your non-negotiable goal?" />
        <button onclick="saveGoal()">Lock In Goal</button>
      </div>

      <div class="card">
        <h2>⚡ Top 3 Daily Habits</h2>
        <div style="display:flex; gap:8px;">
          <input type="text" id="habitInput" placeholder="Add a daily habit (max 3)..." style="margin:0;" />
          <button onclick="addHabit()">Add</button>
        </div>
        <div id="habitList"></div>
      </div>

      <div class="card">
        <h2>🧠 Limiting Belief Transformer</h2>
        <input type="text" id="beliefInput" placeholder="Type a negative thought (e.g. I can't code)..." />
        <button onclick="transformBelief()">Reprogram Thought</button>
        <div id="beliefList"></div>
      </div>
    </div>
  </div>

  <script>
    let focusSeconds = 25 * 60;
    let focusInterval = null;
    let witnessReps = Number(localStorage.getItem('usc_witness_reps') || 0);
    let currentUser = '';

    document.getElementById('witness-rep-count').textContent = witnessReps;

    function renderFocusTime() {
      const mins = String(Math.floor(focusSeconds / 60)).padStart(2, '0');
      const secs = String(focusSeconds % 60).padStart(2, '0');
      document.getElementById('focus-timer-display').textContent = `${mins}:${secs}`;
    }

    function toggleFocusTimer() {
      const btn = document.getElementById('focus-toggle-btn');
      if (focusInterval) {
        clearInterval(focusInterval);
        focusInterval = null;
        btn.textContent = 'Resume Sprint';
        return;
      }
      btn.textContent = 'Pause';
      focusInterval = setInterval(() => {
        if (focusSeconds > 0) {
          focusSeconds--;
          renderFocusTime();
        } else {
          clearInterval(focusInterval);
          focusInterval = null;
          btn.textContent = 'Completed!';
        }
      }, 1000);
    }

    function resetFocusTimer() {
      clearInterval(focusInterval);
      focusInterval = null;
      focusSeconds = 25 * 60;
      renderFocusTime();
      document.getElementById('focus-toggle-btn').textContent = 'Start Sprint';
    }

    async function logWitnessRep() {
      witnessReps++;
      localStorage.setItem('usc_witness_reps', witnessReps);
      document.getElementById('witness-rep-count').textContent = witnessReps;

      if (currentUser) {
        const res = await fetch('/api/witness', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUser })
        });
        const data = await res.json();
        if (!data.error) render(data);
      }
    }

    async function login() {
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) return alert('Enter a username!');
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);
      currentUser = data.username;
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      render(data);
    }

    async function saveGoal() {
      const bigGoal = document.getElementById('goalInput').value;
      const res = await fetch('/api/goal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, bigGoal })
      });
      render(await res.json());
      alert('Goal locked in!');
    }

    async function addHabit() {
      const text = document.getElementById('habitInput').value.trim();
      if (!text) return;
      const res = await fetch('/api/habits', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, text })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);
      document.getElementById('habitInput').value = '';
      render(data);
    }

    async function toggleHabit(habitId) {
      const res = await fetch('/api/habits/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, habitId })
      });
      render(await res.json());
    }

    async function deleteHabit(habitId) {
      const res = await fetch(`/api/habits/${currentUser}/${habitId}`, { method: 'DELETE' });
      render(await res.json());
    }

    async function transformBelief() {
      const limiting = document.getElementById('beliefInput').value.trim();
      if (!limiting) return;
      const res = await fetch('/api/belief', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, limiting })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);
      document.getElementById('beliefInput').value = '';
      render(data);
    }

    function render(user) {
      document.getElementById('goalInput').value = user.bigGoal || '';

      const totalStreak = (user.habits || []).reduce((sum, h) => sum + (h.streak || 0), 0);
      const totalBeliefs = (user.beliefs || []).length;
      const cloudWitness = user.witnessReps || 0;

      document.getElementById('statStreak').textContent = totalStreak;
      document.getElementById('statBeliefs').textContent = totalBeliefs;
      document.getElementById('statWitness').textContent = cloudWitness;
      if (cloudWitness > witnessReps) {
        witnessReps = cloudWitness;
        document.getElementById('witness-rep-count').textContent = witnessReps;
      }

      const rankEl = document.getElementById('evolutionRank');
      const totalScore = totalStreak + totalBeliefs + cloudWitness;
      if (totalScore >= 5) {
        rankEl.textContent = '🏆 Unshakeable Witness';
      } else if (totalScore >= 1) {
        rankEl.textContent = '⚡ Micro-Evolution Builder';
      } else {
        rankEl.textContent = '🚀 Saltation Graduate';
      }

      const habitList = document.getElementById('habitList');
      habitList.innerHTML = (user.habits || []).map(h => `
        <div class="habit-item">
          <div onclick="toggleHabit('${h._id}')" style="cursor:pointer;">
            <input type="checkbox" ${h.completed ? 'checked' : ''} style="width:auto; margin-right:8px;" />
            <span class="${h.completed ? 'done' : ''}">${h.text}</span>
            <span class="badge">🔥 ${h.streak}</span>
          </div>
          <button onclick="deleteHabit('${h._id}')" style="background:#ef4444; padding:4px 10px;">X</button>
        </div>
      `).join('');

      const beliefList = document.getElementById('beliefList');
      beliefList.innerHTML = (user.beliefs || []).map(b => `
        <div class="belief-box">
          <div style="color:#f87171; font-size:13px;">❌ "${b.limiting}"</div>
          <div style="color:#34d399; font-weight:bold; margin-top:4px;">✅ "${b.empowering}"</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
